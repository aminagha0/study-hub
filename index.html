<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIN HAWRAMI | CYBER HUB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-blue: #00d2ff; --main-red: #ff1a1a; --glass: rgba(0, 15, 30, 0.9); }
        body { background: radial-gradient(circle at top, #002b5c 0%, #00050a 100%); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        /* شاشة الدخول */
        #login-overlay { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: linear-gradient(145deg, #1a0000, #000000); padding: 40px 25px; border-radius: 35px; width: 100%; max-width: 380px; text-align: center; border: 2px solid var(--main-red); box-shadow: 0 0 40px rgba(255, 26, 26, 0.4); }
        input { background: #0d0d0d; border: 1px solid #333; color: white; padding: 18px; border-radius: 15px; width: 100%; margin: 20px 0; box-sizing: border-box; text-align: center; font-size: 16px; }
        .btn-login { background: var(--main-red); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* الواجهة الرئيسية */
        #main-app { width: 100%; max-width: 480px; padding: 20px; display: none; padding-bottom: 100px; }
        .nav-tabs { display: flex; background: var(--glass); backdrop-filter: blur(15px); border-radius: 20px; padding: 6px; margin-bottom: 25px; border: 1px solid rgba(0, 210, 255, 0.2); }
        .tab-btn { flex: 1; padding: 14px; text-align: center; cursor: pointer; border-radius: 15px; font-size: 13px; color: var(--neon-blue); transition: 0.3s; }
        .tab-btn.active { background: var(--neon-blue); color: white; font-weight: bold; }
        .main-card { background: var(--glass); border-radius: 35px; padding: 30px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        #timer-text { font-size: 75px; font-weight: 900; margin: 15px 0; text-shadow: 0 0 20px var(--neon-blue); font-family: monospace; }
        .control-btn { background: var(--neon-blue); color: white; border: none; padding: 18px; border-radius: 18px; width: 100%; font-weight: bold; font-size: 18px; margin-top: 10px; cursor: pointer; }
        
        /* قائمة المتصدرين */
        .rank-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-right: 4px solid var(--neon-blue); }
        .tele-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0088cc; color: white; padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 999; border: 2px solid rgba(255,255,255,0.2); }
        .avatar-box { width: 100px; height: 100px; border-radius: 25px; border: 3px solid var(--neon-blue); margin: 0 auto 15px; overflow: hidden; background: #000; }
        #p-img { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none; }
    </style>
</head>
<body>

<a href="https://t.me/AminHawramy" target="_blank" class="tele-btn">💬 تواصل مع المصمم أمين آغا</a>

<div id="login-overlay">
    <div class="login-card">
        <h1 style="color:var(--main-red); margin:0;">STUDY HUB</h1>
        <p style="color:#666; font-size:12px; margin-top:10px;">نرحب بكم بموقع المبرمج المعتزل أمين آغا <br> أتمنى لكم النجاح يا أبطال</p>
        <input type="text" id="user-in" placeholder="اكتب اسمك للمنافسة...">
        <button class="btn-login" onclick="login()">دخول المنصة ⚔️</button>
    </div>
</div>

<div id="main-app">
    <div class="nav-tabs">
        <div class="tab-btn" id="btn-muscle" onclick="tab('muscle')">عضلاتك</div>
        <div class="tab-btn" id="btn-rank" onclick="tab('rank')">المتصدرين</div>
        <div class="tab-btn active" id="btn-study" onclick="tab('study')">الدراسة</div>
    </div>

    <div id="study-sec" class="page">
        <div class="main-card">
            <div style="color:#ffcc00; font-size:20px; margin-bottom:15px;">🔥 صكار الدراسة</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div style="flex:1"><small>الساعات</small><select id="h-set" style="width:100%; background:#000; color:white; border:1px solid #333; padding:8px; border-radius:8px;" onchange="resetTimer()">
                    <script>for(let i=0; i<=12; i++) document.write(`<option value="${i}">${i}</option>`);</script>
                </select></div>
                <div style="flex:1"><small>الدقائق</small><select id="m-set" style="width:100%; background:#000; color:white; border:1px solid #333; padding:8px; border-radius:8px;" onchange="resetTimer()">
                    <script>for(let i=0; i<=59; i++) document.write(`<option value="${i}">${i}</option>`);</script>
                </select></div>
            </div>
            <div id="timer-text">00:00:00</div>
            <button class="control-btn" id="go" onclick="toggle()">ابدأ الجلسة</button>
            <button class="control-btn" style="background:#222;" onclick="takeBreak()">استراحة 5 دقائق</button>
        </div>
    </div>

    <div id="rank-sec" class="page hidden"><div id="rank-list">جاري تحميل المتصدرين...</div></div>

    <div id="muscle-sec" class="page hidden">
        <div class="main-card">
            <div class="avatar-box"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=Amin" id="p-img"></div>
            <h2 id="u-display" style="color:var(--neon-blue); margin:0;">NAME</h2>
            <div style="display:flex; gap:10px; margin-top:25px;">
                <div style="flex:1; background:rgba(0,0,0,0.5); padding:15px; border-radius:20px;"><small>إجمالي الساعات</small><br><b id="total-h" style="font-size:24px;">0.0</b></div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://uvjzcvcootxczskzoobt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_GZC6P1Lbkgo-vsviYRLqlg_HaiAQ-A9'; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let left = 0; let ref = null; let run = false;
    let userName = localStorage.getItem('user_n') || "";

    async function login() {
        const v = document.getElementById('user-in').value.trim();
        if(v){
            localStorage.setItem('user_n', v);
            await supabase.from('leaderboard').upsert({ name: v }, { onConflict: 'name' });
            location.reload();
        }
    }

    window.onload = () => {
        if(userName){
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('u-display').innerText = userName;
            loadData();
            resetTimer();
        }
    }

    async function loadData() {
        const { data } = await supabase.from('leaderboard').select('*').eq('name', userName).maybeSingle();
        if(data) document.getElementById('total-h').innerText = data.hours.toFixed(1);
    }

    function tab(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById(id + '-sec').classList.remove('hidden');
        document.getElementById('btn-' + id).classList.add('active');
        if(id === 'rank') fetchRank();
    }

    function resetTimer() {
        if(!run) {
            const h = parseInt(document.getElementById('h-set').value);
            const m = parseInt(document.getElementById('m-set').value);
            left = (h * 3600) + (m * 60);
            draw();
        }
    }

    function toggle() {
        const b = document.getElementById('go');
        if(run){ clearInterval(ref); run = false; b.innerText = "استئناف"; updateDB(); }
        else {
            run = true; b.innerText = "إيقاف مؤقت";
            ref = setInterval(() => { 
                if(left > 0) { left--; draw(); }
                else { clearInterval(ref); run = false; alert("كفو! خلصت الجلسة."); updateDB(); }
            }, 1000);
        }
    }

    function draw() {
        const h = Math.floor(left / 3600);
        const m = Math.floor((left % 3600) / 60);
        const s = left % 60;
        document.getElementById('timer-text').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    async function updateDB() {
        const currentH = parseFloat(document.getElementById('total-h').innerText);
        // نزيد 0.1 ساعة كعربون تشجيعي عند كل إيقاف أو نهاية جلسة
        await supabase.from('leaderboard').update({ hours: currentH + 0.1 }).eq('name', userName);
        loadData();
    }

    async function fetchRank() {
        const { data } = await supabase.from('leaderboard').select('*').order('hours', { ascending: false });
        const list = document.getElementById('rank-list');
        if(data) {
            list.innerHTML = data.map((u, i) => `
                <div class="rank-item">
                    <span>#${i+1} ${u.name} ${u.name === userName ? '(أنت)' : ''}</span>
                    <b>${u.hours.toFixed(1)} ساعة</b>
                </div>
            `).join('');
        }
    }

    function takeBreak() { if(!run) { left = 300; draw(); } }
</script>
</body>
</html>
