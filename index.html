<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDY HUB</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { border: 2px solid #ff1a1a; padding: 40px; border-radius: 30px; width: 300px; text-align: center; box-shadow: 0 0 30px #ff1a1a; }
        input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 1px solid #333; background: #111; color: white; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 12px; background: #ff1a1a; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 18px; }
        #app { display: none; text-align: center; }
    </style>
</head>
<body>
    <div id="login-box">
        <div class="card">
            <h1 style="color:#ff1a1a;">STUDY HUB</h1>
            <input type="text" id="username" placeholder="اكتب اسمك هنا...">
            <button onclick="login()">دخول المنصة ⚔️</button>
        </div>
    </div>
    <div id="app">
        <h1 style="color:#00d2ff;">أهلاً بك يا بطل!</h1>
        <div style="font-size: 50px; margin: 20px;" id="timer">01:00:00</div>
        <button style="background:#00d2ff; color:black;" onclick="localStorage.clear(); location.reload();">خروج</button>
    </div>
    <script>
        function login() {
            const user = document.getElementById('username').value.trim();
            if(user) {
                localStorage.setItem('user', user);
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }
        }
        window.onload = () => {
            if(localStorage.getItem('user')) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }
        }
    </script>
</body>
</html>
